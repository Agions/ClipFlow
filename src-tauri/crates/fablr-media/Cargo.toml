[package]
name = "fablr-media"
version = "2.2.0"
edition = "2021"
description = "Fablr 音视频处理、转写、高光、TTS与LLM核心处理引擎"
authors = ["Agions <agions@qq.com>"]
license = "MIT"

[dependencies]
fablr-domain = { path = "../fablr-domain" }
fablr-db = { path = "../fablr-db" }
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "fs", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
futures-util = "0.3"
once_cell = "1"
log = "0.4"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
