<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="剧工">
  <title>剧工 — AI 影视/短剧解说创作平台</title>
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="jgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="50%" stop-color="#11121d"/>
      <stop offset="100%" stop-color="#18192b"/>
    </linearGradient>

    <!-- 极光紫至科技青主渐变 -->
    <linearGradient id="jgPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- 高光金辉渐变 -->
    <linearGradient id="jgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="jgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 外框圆角底座 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#jgBg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" ry="110" fill="none" stroke="url(#jgPrimary)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- 环形电影胶片齿孔轨道 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#jgPrimary)" stroke-width="3" stroke-dasharray="12 18" stroke-opacity="0.35"/>

  <!-- 核心图标：以书法篆刻骨架融合现代镜头与工匠刻刀的「剧」字图腾与极光三角 -->
  <g filter="url(#jgGlow)">
    <!-- 左侧胶片立柱与齿孔 -->
    <rect x="136" y="128" width="48" height="256" rx="14" fill="url(#jgPrimary)"/>
    <circle cx="160" cy="164" r="8" fill="#08080d"/>
    <circle cx="160" cy="224" r="8" fill="#08080d"/>
    <circle cx="160" cy="284" r="8" fill="#08080d"/>
    <circle cx="160" cy="344" r="8" fill="#08080d"/>

    <!-- 顶部横梁 -->
    <path d="M 136 128 L 360 128 C 372 128 380 138 376 150 L 356 196 C 352 204 344 210 334 210 L 184 210 L 136 128 Z" fill="url(#jgPrimary)"/>

    <!-- 中部高光播放切割翼锋 -->
    <path d="M 184 246 L 316 246 C 328 246 336 256 332 268 L 318 298 C 314 306 306 312 296 312 L 184 312 Z" fill="url(#jgPrimary)"/>

    <!-- 右侧下部工匠刻刀锋芒（金色） -->
    <polygon points="280,336 348,336 376,384 308,384" fill="url(#jgGold)"/>
  </g>

  <!-- 右上角灵感闪耀星芒 -->
  <g transform="translate(378, 140)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#06b6d4"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
</svg>